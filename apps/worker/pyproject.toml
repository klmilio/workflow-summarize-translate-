[project]
name = "worker"
version = "0.1.0"
description = "Mistral Workflows worker for the summarize-and-translate workflow"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio==0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
